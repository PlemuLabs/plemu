name: Emergency Revoke

# Manually revoke one or more registry entries and republish a fresh signed
# manifest. Target: entry off every device within <30 minutes of dispatch.
#
# This marks entries revoked by writing a per-entry revocation.json sidecar
# (SPEC §4): metadata.json is left untouched (it stays the Entry-minus-revoked*
# record), and the presence of the sidecar is what marks an entry revoked —
# `plemu-manifest build` reads it and emits revoked:true. It also appends an
# audit line to removals.ndjson, rebuilds+signs+verifies the manifest exactly
# like the nightly sign-and-publish job, and publishes.
#
# HONESTY: the commit + publish steps depend on infra that does not exist yet
# (bot app token, R2, releases). Those are marked `# TODO(infra): ...`. The
# registry mutation + manifest rebuild + verify DO run for real.

on:
  workflow_dispatch:
    inputs:
      entry_ids:
        description: "Comma-separated entry ids to revoke, e.g. gb/starforge-demo,wasm4/hello-plemu"
        type: string
        required: true
      reason:
        description: "Revocation reason"
        type: choice
        options:
          - dmca
          - license-dispute
          - malware
          - creator-request
        required: true
      evidence_url:
        description: "URL to the DMCA notice / dispute / report backing this revocation"
        type: string
        required: true

concurrency:
  group: emergency-revoke
  cancel-in-progress: false

env:
  RUST_VERSION: "1.93.1"

permissions:
  contents: read

jobs:
  revoke:
    name: Revoke entries and republish
    runs-on: ubuntu-latest
    # TODO(infra): the same publish environment/secret as the nightly.
    environment: manifest-publish
    steps:
      - name: Checkout governance (tools)
        uses: actions/checkout@v4

      - name: Checkout registry (writable)
        uses: actions/checkout@v4
        with:
          # TODO(infra): org name final — repository does not exist yet.
          repository: plemu/plemu-registry
          path: plemu-registry
          # TODO(infra): a bot token with contents:write is required to push the
          # revocation commit back to the registry.
          # token: ${{ secrets.PLEMU_REGISTRY_BOT_TOKEN }}
        continue-on-error: true

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Write revocation sidecars
        id: revoke
        env:
          ENTRY_IDS: ${{ inputs.entry_ids }}
          REASON: ${{ inputs.reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          set -euo pipefail
          if [ ! -d plemu-registry/registry ]; then
            echo "::error::registry not available (TODO(infra): repo does not exist yet). Cannot revoke — failing closed."
            exit 1
          fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Revocation is a per-entry SIDECAR file (SPEC §4): metadata.json stays the
          # Entry-minus-revoked* record; the presence of revocation.json is what marks
          # an entry revoked, and `plemu-manifest build` reads it to emit revoked:true.
          IFS=',' read -ra IDS <<< "$ENTRY_IDS"
          for RAW in "${IDS[@]}"; do
            ID="$(echo "$RAW" | xargs)"   # trim whitespace
            [ -z "$ID" ] && continue
            DIR="plemu-registry/registry/${ID}"
            META="${DIR}/metadata.json"
            if [ ! -f "$META" ]; then
              echo "::error::no metadata.json for entry '${ID}' at ${META}"
              exit 1
            fi
            echo "Revoking ${ID} (reason=${REASON}) via revocation.json sidecar"
            # Write revocation.json = { reason, revokedAt }. reason must be one of the
            # SPEC RevokedReason values (enforced by the workflow_dispatch choice input
            # AND re-validated by build's RevokedReason parse).
            REV="${DIR}/revocation.json"
            jq -n --arg reason "$REASON" --arg now "$NOW" \
              '{reason:$reason, revokedAt:$now}' > "$REV"
            # Validate before leaving it in place — never write a corrupt sidecar.
            python3 -m json.tool "$REV" > /dev/null
            # Append an audit line to removals.ndjson.
            jq -c -n --arg id "$ID" --arg reason "$REASON" --arg evidence "$EVIDENCE_URL" --arg now "$NOW" \
              '{id:$id, reason:$reason, evidenceUrl:$evidence, revokedAt:$now}' \
              >> plemu-registry/removals.ndjson
          done
          echo "revoked_at=$NOW" >> "$GITHUB_OUTPUT"

      - name: Commit revocation (TODO — bot token)
        env:
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # TODO(infra): needs the plemu-registry-bot app token (contents:write on
          # the registry) to actually push. Locally we stage + show the diff so the
          # workflow shape is real, but do not fake a push.
          cd plemu-registry
          git config user.name "plemu-registry-bot"
          git config user.email "bot@plemu.xyz"
          git add -A
          echo "=== staged revocation diff ==="
          git --no-pager diff --cached --stat || true
          echo "::warning::Not pushing: TODO(infra): plemu-registry-bot app token required."
          # git commit -m "revoke: ${REASON} (emergency) [run ${{ github.run_id }}]"
          # git push

      - name: Rebuild manifest
        env:
          ENTRY_IDS: ${{ inputs.entry_ids }}
        run: |
          set -euo pipefail
          # TODO(infra): --previous last-manifest.json from R2 for sequence continuity.
          cargo run -p plemu-manifest -- build \
            --registry plemu-registry/registry \
            --base-url https://cdn.plemu.xyz \
            --signer-key-id plemu-manifest-dev-a \
            --out manifest.json

          # `build` reads each entry's revocation.json sidecar and emits
          # revoked:true for it (SPEC §4). Assert every requested id now materializes
          # as revoked:true in the manifest — fail closed if any is still live (e.g.
          # a typo'd id whose sidecar landed in the wrong dir).
          IFS=',' read -ra IDS <<< "$ENTRY_IDS"
          STILL_LIVE=0
          for RAW in "${IDS[@]}"; do
            ID="$(echo "$RAW" | xargs)"
            [ -z "$ID" ] && continue
            REVOKED=$(jq -r --arg id "$ID" \
              '[.entries[] | select(.id==$id and .revoked==true)] | length' manifest.json)
            if [ "$REVOKED" = "0" ]; then
              echo "::error::entry '$ID' is NOT revoked:true in the rebuilt manifest — revocation did not take effect."
              STILL_LIVE=1
            else
              echo "entry '$ID' is revoked:true in the manifest."
            fi
          done
          if [ "$STILL_LIVE" -ne 0 ]; then
            echo "Revocation did not take effect. Check that revocation.json was written into the correct entry dir. Failing closed."
            exit 1
          fi

      - name: Sign manifest
        env:
          # TODO(infra): PLEMU_MANIFEST_KEY environment secret (same as nightly).
          PLEMU_MANIFEST_KEY: ${{ secrets.PLEMU_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLEMU_MANIFEST_KEY:-}" ]; then
            echo "::error::PLEMU_MANIFEST_KEY not set (TODO(infra): environment secret). Cannot sign — failing closed."
            exit 1
          fi
          cargo run -p plemu-manifest -- sign \
            --manifest manifest.json \
            --key-env PLEMU_MANIFEST_KEY \
            --key-id plemu-manifest-dev-a \
            --keys keys/manifest-signers.json \
            --out manifest.sig

      - name: Verify before publish (abort on mismatch)
        run: |
          set -euo pipefail
          cargo run -p plemu-manifest -- verify \
            --manifest manifest.json \
            --sig manifest.sig \
            --keys keys/manifest-signers.json

      - name: Publish (TODO — no R2 / release infra yet)
        run: |
          set -euo pipefail
          echo "::warning::Publish is SCAFFOLD. TODO(infra): R2 + cache purge + release do not exist yet."
          # TODO(infra): identical publish path to the nightly sign-and-publish job:
          #   rclone copyto manifest.json r2:plemu-manifests/manifest.json
          #   rclone copyto manifest.sig  r2:plemu-manifests/manifest.sig
          #   curl -X POST <cloudflare purge> -d '{"files":["https://cdn.plemu.xyz/manifest.json"]}'
          #   rclone copyto manifest.json r2:plemu-manifests/by-date/$(date -u +%Y-%m-%d)/manifest.json
          #   gh release create emergency-$(date -u +%Y-%m-%dT%H%M%SZ) manifest.json manifest.sig
          echo "Target: entry off every device within <30 min of this dispatch."

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-manifest
          path: |
            manifest.json
            manifest.sig
          if-no-files-found: warn
