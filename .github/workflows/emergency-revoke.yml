name: Emergency Revoke

# Manually revoke or reinstate one or more registry entries and republish a fresh signed
# manifest. Target: entry off every device within <30 minutes of dispatch.
#
# This marks entries revoked by writing a per-entry revocation.json sidecar
# (SPEC §4): metadata.json is left untouched (it stays the Entry-minus-revoked*
# record), and the presence of the sidecar is what marks an entry revoked —
# `plemu-manifest build` reads it and emits revoked:true. It also appends an
# audit line to removals.ndjson, rebuilds+signs+verifies the manifest exactly
# like the nightly sign-and-publish job, and publishes.
#
# HONESTY: the commit + publish steps depend on infra that does not exist yet
# (bot app token, R2, releases). Those are marked `# TODO(infra): ...`. The
# registry mutation + manifest rebuild + verify DO run for real.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to take (revoke or reinstate)"
        type: choice
        options:
          - revoke
          - reinstate
        default: revoke
        required: true
      tier:
        description: "Registry tier (beta or main)"
        type: choice
        options:
          - beta
          - main
        default: beta
        required: true
      entry_ids:
        description: "Comma-separated entry ids, e.g. gb/starforge-demo,wasm4/hello-plemu"
        type: string
        required: true
      reason:
        description: "Revocation or reinstatement reason"
        type: choice
        options:
          - dmca
          - license-dispute
          - malware
          - creator-request
        required: true
      evidence_url:
        description: "URL or reference to the notice / dispute / report backing this action"
        type: string
        required: true

concurrency:
  group: emergency-revoke
  cancel-in-progress: false

env:
  RUST_VERSION: "1.93.1"

permissions:
  contents: read

jobs:
  revoke:
    name: Revoke or reinstate entries and republish
    runs-on: ubuntu-latest
    # TODO(infra): the same publish environment/secret as the nightly.
    environment: manifest-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Apply revocation or reinstatement
        id: revoke
        env:
          ACTION: ${{ inputs.action }}
          TIER: ${{ inputs.tier }}
          ENTRY_IDS: ${{ inputs.entry_ids }}
          REASON: ${{ inputs.reason }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          set -euo pipefail
          if [ ! -d "registry/${TIER}" ]; then
            echo "::error::registry tier 'registry/${TIER}' does not exist. Failing closed."
            exit 1
          fi
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EVENT_TYPE="removed"
          if [ "$ACTION" = "reinstate" ]; then
            EVENT_TYPE="reinstated"
          fi

          IFS=',' read -ra IDS <<< "$ENTRY_IDS"
          for RAW in "${IDS[@]}"; do
            ID="$(echo "$RAW" | xargs)"   # trim whitespace
            [ -z "$ID" ] && continue
            DIR="registry/${TIER}/${ID}"
            META="${DIR}/metadata.json"
            if [ ! -f "$META" ]; then
              echo "::error::no metadata.json for entry '${ID}' at ${META}"
              exit 1
            fi

            REV="${DIR}/revocation.json"
            if [ "$ACTION" = "revoke" ]; then
              echo "Revoking ${ID} (reason=${REASON}) via revocation.json sidecar"
              jq -n --arg reason "$REASON" --arg now "$NOW" \
                '{reason:$reason, revokedAt:$now}' > "$REV"
              python3 -m json.tool "$REV" > /dev/null
            else
              echo "Reinstating ${ID} by removing revocation.json sidecar"
              rm -f "$REV"
            fi

            # Append an audit line to removals.ndjson matching SPEC in registry/docs/dmca-policy.md
            jq -c -n --arg eventType "$EVENT_TYPE" --arg entryId "$ID" --arg reason "$REASON" --arg timestamp "$NOW" --arg noticeRef "$EVIDENCE_URL" \
              '{eventType:$eventType, entryId:$entryId, reason:$reason, timestamp:$timestamp, noticeRef:$noticeRef}' \
              >> registry/removals.ndjson
          done
          echo "action_at=$NOW" >> "$GITHUB_OUTPUT"

      - name: Commit revocation (TODO — bot token)
        env:
          ACTION: ${{ inputs.action }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # TODO(infra): needs the plemu-registry-bot app token (contents:write on
          # the registry) to actually push. Locally we stage + show the diff so the
          # workflow shape is real, but do not fake a push.
          git config user.name "plemu-registry-bot"
          git config user.email "bot@plemu.xyz"
          git add registry/
          echo "=== staged revocation diff ==="
          git --no-pager diff --cached --stat || true
          echo "::warning::Not pushing: TODO(infra): plemu-registry-bot app token required."
          # git commit -m "${ACTION}: ${REASON} (emergency) [run ${{ github.run_id }}]"
          # git push

      - name: Rebuild manifest
        env:
          ACTION: ${{ inputs.action }}
          TIER: ${{ inputs.tier }}
          ENTRY_IDS: ${{ inputs.entry_ids }}
        run: |
          set -euo pipefail
          # TODO(infra): --previous last-manifest.json from R2 for sequence continuity.
          cargo run -p plemu-manifest -- build \
            --registry registry \
            --tier "$TIER" \
            --base-url https://cdn.plemu.xyz \
            --signer-key-id plemu-manifest-dev-a \
            --out "manifest-${TIER}.json"

          # Assert that requested entries materialized with the expected revocation status
          IFS=',' read -ra IDS <<< "$ENTRY_IDS"
          CHECK_FAILED=0
          for RAW in "${IDS[@]}"; do
            ID="$(echo "$RAW" | xargs)"
            [ -z "$ID" ] && continue
            if [ "$ACTION" = "revoke" ]; then
              REVOKED=$(jq -r --arg id "$ID" \
                '[.entries[] | select(.id==$id and .revoked==true)] | length' "manifest-${TIER}.json")
              if [ "$REVOKED" = "0" ]; then
                echo "::error::entry '$ID' is NOT revoked:true in rebuilt manifest — revocation did not take effect."
                CHECK_FAILED=1
              else
                echo "entry '$ID' is revoked:true in the manifest."
              fi
            else
              REVOKED=$(jq -r --arg id "$ID" \
                '[.entries[] | select(.id==$id and .revoked==true)] | length' "manifest-${TIER}.json")
              if [ "$REVOKED" != "0" ]; then
                echo "::error::entry '$ID' is STILL revoked in rebuilt manifest — reinstatement did not take effect."
                CHECK_FAILED=1
              else
                echo "entry '$ID' is reinstated (revoked:false) in the manifest."
              fi
            fi
          done
          if [ "$CHECK_FAILED" -ne 0 ]; then
            echo "Operation did not take effect. Check sidecar mutations. Failing closed."
            exit 1
          fi

      - name: Sign manifest
        env:
          TIER: ${{ inputs.tier }}
          # TODO(infra): PLEMU_MANIFEST_KEY environment secret (same as nightly).
          PLEMU_MANIFEST_KEY: ${{ secrets.PLEMU_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLEMU_MANIFEST_KEY:-}" ]; then
            echo "::error::PLEMU_MANIFEST_KEY not set (TODO(infra): environment secret). Cannot sign — failing closed."
            exit 1
          fi
          cargo run -p plemu-manifest -- sign \
            --manifest "manifest-${TIER}.json" \
            --key-env PLEMU_MANIFEST_KEY \
            --key-id plemu-manifest-dev-a \
            --keys tools/keys/manifest-signers.json \
            --out "manifest-${TIER}.json.sig"

      - name: Verify before publish (abort on mismatch)
        env:
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          cargo run -p plemu-manifest -- verify \
            --manifest "manifest-${TIER}.json" \
            --sig "manifest-${TIER}.json.sig" \
            --keys tools/keys/manifest-signers.json

      - name: Publish (TODO — no R2 / release infra yet)
        env:
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          echo "::warning::Publish is SCAFFOLD. TODO(infra): R2 + cache purge + release do not exist yet."
          # TODO(infra): identical publish path to the nightly sign-and-publish job:
          #   rclone copyto manifest-${TIER}.json r2:plemu-manifests/manifest-${TIER}.json
          #   rclone copyto manifest-${TIER}.json.sig  r2:plemu-manifests/manifest-${TIER}.json.sig
          #   curl -X POST <cloudflare purge> -d "{\"files\":[\"https://cdn.plemu.xyz/manifest-${TIER}.json\"]}"
          #   rclone copyto manifest-${TIER}.json r2:plemu-manifests/by-date/$(date -u +%Y-%m-%d)/manifest-${TIER}.json
          #   gh release create emergency-${TIER}-$(date -u +%Y-%m-%dT%H%M%SZ) manifest-${TIER}.json manifest-${TIER}.json.sig
          echo "Target: entry off every device within <30 min of this dispatch."

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-manifest-${{ inputs.tier }}
          path: |
            manifest-${{ inputs.tier }}.json
            manifest-${{ inputs.tier }}.json.sig
          if-no-files-found: warn
