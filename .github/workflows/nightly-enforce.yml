name: Nightly Enforce

# The nightly enforcement pipeline is the heartbeat of the content-trust system:
# it re-audits every core license, re-screens every registry entry against a fresh
# denylist, rebuilds the cores + app, and only then republishes the signed manifest.
# It FAILS CLOSED — publication (job sign-and-publish) runs only if a–e are green.
#
# Job graph (approved plan):
#   (a) core-license-audit ─┐
#   (b) forbidden-core-guard ┤
#   (c) registry-audit ──────┼─> (f) sign-and-publish ─> (g) notify
#       └─ needs dat-refresh  │
#   (d) build-cores ─────────┤
#   (e) build-app ───────────┘
#
# HONESTY: remote infrastructure does not exist yet. Every step that depends on
# absent infra is marked `# TODO(infra): ...` and, where possible, runs a local
# fallback or an honest SCAFFOLD echo. Nothing here pretends to publish.

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options:
          - full
          - publish-only
        default: full
      reason:
        description: "Reason for a manual run (audit trail)"
        type: string
        required: false

# Never cancel an in-flight nightly: a publish half-done is worse than a delayed one.
concurrency:
  group: nightly-enforce
  cancel-in-progress: false

# Pinning block: the whole run uses one Rust version and one plemu-tools ref so a
# nightly is reproducible. Bump these deliberately in a reviewed PR.
env:
  RUST_VERSION: "1.93.1"
  # TODO(infra): PLEMU_REF pins the plemu-* tools source. Today the tools live in
  # THIS repo, so the ref is the commit being run. Once tools move to a release, pin
  # a tag + verify a binary sha256 instead of building from source.
  PLEMU_REF: "main"

permissions:
  contents: read

jobs:
  # ── (dat-refresh) Rebuild the No-Intro/Redump denylist ────────────────────────
  dat-refresh:
    name: Refresh denylist from DAT sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance (tools)
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Acquire DAT sources
        run: |
          set -euo pipefail
          mkdir -p dats
          # TODO(infra): pin ref + schedule Redump direct downloads + monthly manual
          # No-Intro snapshot. For now we clone the public libretro-database at HEAD
          # (its dat/ tree carries No-Intro-derived sets) so the pipeline has real
          # inputs; production must pin a ref and add Redump + No-Intro snapshots.
          #
          #   git clone --depth 1 https://github.com/libretro/libretro-database db
          #   find db/dat db/metadat -name '*.dat' -exec cp {} dats/ \;
          #
          # Until the ref is pinned we do NOT silently ship an empty denylist: emit a
          # placeholder DAT so `plemu-dat build` produces a schema-valid (but clearly
          # non-production) denylist, and flag it loudly.
          echo "::warning::dat-refresh is using a PLACEHOLDER dat set. TODO(infra): pin libretro-database ref + add Redump/No-Intro snapshots."
          cat > dats/PLACEHOLDER.dat <<'DAT'
          <?xml version="1.0"?>
          <datafile>
            <header><name>PLACEHOLDER - not a production denylist</name></header>
          </datafile>
          DAT

      - name: Build denylist
        run: |
          set -euo pipefail
          cargo run -p plemu-dat -- build --input dats --out denylist.sqlite --source nightly

      - name: Staleness policy
        run: |
          set -euo pipefail
          # Warn if the newest DAT source is older than 14 days; fail if older than 30.
          # TODO(infra): the real staleness signal is the R2 snapshot history (when the
          # last successful Redump/No-Intro snapshot was taken). Without R2 we can only
          # check the local file mtimes of the DATs we just fetched, which is a weak
          # proxy — flagged so it is never mistaken for the real check.
          echo "::warning::Staleness check is a PLACEHOLDER (local mtime proxy). TODO(infra): compute staleness from R2 snapshot history (warn >14d, fail >30d)."
          NEWEST=$(find dats -name '*.dat' -printf '%T@\n' | sort -nr | head -1 || echo 0)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - ${NEWEST%.*}) / 86400 ))
          echo "Newest DAT age: ${AGE_DAYS}d"
          if [ "$AGE_DAYS" -gt 30 ]; then
            echo "::error::DAT sources older than 30 days — failing closed."
            exit 1
          elif [ "$AGE_DAYS" -gt 14 ]; then
            echo "::warning::DAT sources older than 14 days."
          fi

      - name: Upload denylist artifact
        uses: actions/upload-artifact@v4
        with:
          name: denylist
          path: denylist.sqlite
          retention-days: 14

  # ── (a) core-license-audit ────────────────────────────────────────────────────
  core-license-audit:
    name: Core license audit (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout governance (tools)
        uses: actions/checkout@v4

      - name: Checkout cores repo
        uses: actions/checkout@v4
        with:
          # TODO(infra): org name final — repository does not exist yet.
          repository: plemu/plemu-cores
          path: plemu-cores
          submodules: recursive
          # TODO(infra): private repo will need a token here.
        continue-on-error: true

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Run plemu-core-audit --strict
        id: audit
        run: |
          set -euo pipefail
          if [ ! -d plemu-cores/cores ]; then
            echo "::error::plemu-cores not available (TODO(infra): repo does not exist yet). Failing closed."
            # The cores repo is required for a real audit; absence must not silently pass.
            exit 1
          fi
          cargo run -p plemu-core-audit -- \
            --lock plemu-cores/cores/expected-licenses.lock \
            --cores-dir plemu-cores/cores \
            --build-config plemu-cores/cores/cores.build.json \
            --strict \
            --out core-audit-report.json

      - name: Open license-drift issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # TODO(infra): needs the cores repo + a token with issues:write on the target repo.
          echo "::warning::Would open a license-drift issue. TODO(infra): needs repo + token."
          if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
            gh issue create \
              --title "Nightly: core license drift $(date -u +%Y-%m-%d)" \
              --body "plemu-core-audit --strict failed. See run ${{ github.run_id }}." \
              --label license-drift || echo "::warning::gh issue create failed (expected until repo/token exist)."
          fi

  # ── (b) forbidden-core-guard ──────────────────────────────────────────────────
  forbidden-core-guard:
    name: Forbidden-core guard (belt and braces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance (tools)
        uses: actions/checkout@v4

      - name: Checkout cores repo
        uses: actions/checkout@v4
        with:
          # TODO(infra): org name final — repository does not exist yet.
          repository: plemu/plemu-cores
          path: plemu-cores
          submodules: recursive
        continue-on-error: true

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: plemu-core-audit build-config check
        run: |
          set -euo pipefail
          if [ ! -d plemu-cores/cores ]; then
            echo "::error::plemu-cores not available (TODO(infra): repo does not exist yet). Failing closed."
            exit 1
          fi
          cargo run -p plemu-core-audit -- \
            --lock plemu-cores/cores/expected-licenses.lock \
            --cores-dir plemu-cores/cores \
            --build-config plemu-cores/cores/cores.build.json \
            --strict

      - name: Belt-and-braces grep for forbidden ids
        run: |
          set -euo pipefail
          # SPEC §1.5 FORBIDDEN core identifiers. A second, independent check that does
          # not rely on plemu-core-audit parsing: a raw grep over the cores config.
          FORBIDDEN="snes9x genesis_plus_gx picodrive fbneo fbalpha duckstation swanstation mame2000 mame2003 mame2003_plus mame2010 mesen"
          FILES="plemu-cores/cores/cores.build.json plemu-cores/cores/expected-licenses.lock plemu-cores/cores/forbidden.json"
          if [ ! -d plemu-cores/cores ]; then
            echo "::error::plemu-cores not available (TODO(infra): repo does not exist yet). Failing closed."
            exit 1
          fi
          HIT=0
          for id in $FORBIDDEN; do
            # forbidden.json legitimately LISTS these ids as denied; only scan the
            # config files that must NOT reference them (build + lock).
            for f in plemu-cores/cores/cores.build.json plemu-cores/cores/expected-licenses.lock; do
              [ -f "$f" ] || continue
              if grep -qiE "\"(coreId|core_id)\"[[:space:]]*:[[:space:]]*\"${id}" "$f"; then
                echo "::error::forbidden core id '${id}' referenced in $f"
                HIT=1
              fi
            done
          done
          if [ "$HIT" -ne 0 ]; then
            echo "Forbidden core id(s) found — failing closed."
            exit 1
          fi
          echo "No forbidden core ids in build/lock config."

  # ── (c) registry-audit ────────────────────────────────────────────────────────
  registry-audit:
    name: Registry audit (screen all)
    runs-on: ubuntu-latest
    needs: dat-refresh
    steps:
      - name: Checkout governance (tools)
        uses: actions/checkout@v4

      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          # TODO(infra): org name final — repository does not exist yet.
          repository: plemu/plemu-registry
          path: plemu-registry
        continue-on-error: true

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Download denylist
        uses: actions/download-artifact@v4
        with:
          name: denylist

      - name: Screen all registry entries
        id: screen
        run: |
          set -euo pipefail
          if [ ! -d plemu-registry/registry ]; then
            echo "::error::plemu-registry not available (TODO(infra): repo does not exist yet). Failing closed."
            exit 1
          fi
          # TODO(infra): re-download each artifact from R2 by sha256 and re-hash it
          # before screening. Today the entries are local dev fixtures and the
          # committed artifact bytes are hashed in place.
          echo "::warning::Screening local fixture artifacts. TODO(infra): re-download artifacts from R2 by sha256 and re-hash."
          set +e
          cargo run -p plemu-screen -- \
            --all --registry plemu-registry/registry \
            --denylist denylist.sqlite \
            --keys keys/manifest-signers.json \
            --out compliance-report.json
          CODE=$?
          set -e
          echo "screen_exit=$CODE" >> "$GITHUB_OUTPUT"
          # Exit-code mapping: 20 fails the job; 10 passes-with-warning; 0 clean.
          if [ "$CODE" -eq 20 ]; then
            echo "::error::registry screening hard-failed (exit 20)."
            exit 20
          elif [ "$CODE" -eq 10 ]; then
            echo "::warning::registry screening needs human review (exit 10)."
          elif [ "$CODE" -ne 0 ]; then
            echo "::error::plemu-screen tool error (exit $CODE)."
            exit "$CODE"
          fi

      - name: Upload compliance report
        # Upload the report whether the screen passed, warned, or failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.json
          retention-days: 30
          if-no-files-found: warn

  # ── (d) build-cores ───────────────────────────────────────────────────────────
  build-cores:
    name: Build cores (SCAFFOLD)
    runs-on: ubuntu-latest
    steps:
      # TODO(infra): call the reusable workflow once it exists with core pinning:
      #   uses: plemu/plemu-cores/.github/workflows/build-cores.yml@main
      # For now this job EXISTS in the graph (so the dependency edge into
      # sign-and-publish is real) but only runs an honest scaffold step.
      - name: SCAFFOLD build-cores
        run: |
          echo "SCAFFOLD: build-cores would compile all pinned libretro cores for arm64."
          echo "TODO(infra): reusable workflow plemu/plemu-cores/.github/workflows/build-cores.yml@main lands with core pinning."
          exit 0

  # ── (e) build-app ─────────────────────────────────────────────────────────────
  build-app:
    name: Build app (SCAFFOLD)
    runs-on: ubuntu-latest
    steps:
      # TODO(infra): call the reusable workflow once it exists with Unity CI licensing:
      #   uses: plemu/plemu-app/.github/workflows/build-psg1.yml@main
      - name: SCAFFOLD build-app
        run: |
          echo "SCAFFOLD: build-app would build the PSG1 Unity player (AAB) with the baked-in starter manifest."
          echo "TODO(infra): reusable workflow plemu/plemu-app/.github/workflows/build-psg1.yml@main lands with Unity CI licensing."
          exit 0

  # ── (f) sign-and-publish ──────────────────────────────────────────────────────
  sign-and-publish:
    name: Sign and publish manifest
    runs-on: ubuntu-latest
    needs:
      - dat-refresh
      - core-license-audit
      - forbidden-core-guard
      - registry-audit
      - build-cores
      - build-app
    # TODO(infra): create this environment + attach the PLEMU_MANIFEST_KEY secret.
    environment: manifest-publish
    permissions:
      contents: read
    steps:
      - name: Checkout governance (tools)
        uses: actions/checkout@v4

      - name: Checkout registry
        uses: actions/checkout@v4
        with:
          repository: plemu/plemu-registry
          path: plemu-registry
        continue-on-error: true

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build manifest
        run: |
          set -euo pipefail
          if [ ! -d plemu-registry/registry ]; then
            echo "::error::registry not available (TODO(infra): repo does not exist yet). Failing closed."
            exit 1
          fi
          # TODO(infra): fetch the previously published manifest for sequence
          # continuation: --previous last-manifest.json (from R2). Without R2 the
          # sequence restarts at 1 each run, which is fine for a scaffold but MUST
          # use --previous in production to satisfy the device anti-rollback rule.
          cargo run -p plemu-manifest -- build \
            --registry plemu-registry/registry \
            --base-url https://cdn.plemu.xyz \
            --signer-key-id plemu-manifest-dev-a \
            --out manifest.json

      - name: Sign manifest
        env:
          # TODO(infra): PLEMU_MANIFEST_KEY is an environment secret holding the
          # PKCS#8 Ed25519 PEM. v1.5 replaces this with OIDC -> KMS signing.
          PLEMU_MANIFEST_KEY: ${{ secrets.PLEMU_MANIFEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PLEMU_MANIFEST_KEY:-}" ]; then
            echo "::error::PLEMU_MANIFEST_KEY secret not set (TODO(infra): create environment + secret). Cannot sign — failing closed."
            exit 1
          fi
          cargo run -p plemu-manifest -- sign \
            --manifest manifest.json \
            --key-env PLEMU_MANIFEST_KEY \
            --key-id plemu-manifest-dev-a \
            --keys keys/manifest-signers.json \
            --out manifest.sig

      - name: Verify before publish (abort on mismatch)
        run: |
          set -euo pipefail
          # Re-verify the freshly signed manifest against the pinned registry. A
          # mismatch here means we would publish an unverifiable manifest — abort.
          cargo run -p plemu-manifest -- verify \
            --manifest manifest.json \
            --sig manifest.sig \
            --keys keys/manifest-signers.json

      - name: Publish (TODO — no R2 / release infra yet)
        run: |
          set -euo pipefail
          echo "::warning::Publish steps are SCAFFOLD. TODO(infra): none of the targets below exist yet."
          # TODO(infra): R2 upload via rclone S3 API:
          #   rclone copyto manifest.json r2:plemu-manifests/manifest.json
          #   rclone copyto manifest.sig  r2:plemu-manifests/manifest.sig
          # TODO(infra): single-URL cache purge (Cloudflare) so devices see the new manifest:
          #   curl -X POST "https://api.cloudflare.com/.../purge_cache" -d '{"files":["https://cdn.plemu.xyz/manifest.json"]}'
          # TODO(infra): immutable by-date copy for audit + rollback:
          #   rclone copyto manifest.json r2:plemu-manifests/by-date/$(date -u +%Y-%m-%d)/manifest.json
          # TODO(infra): append to changelog.ndjson (one JSON line per publish, with sequence + sha256):
          #   echo "{\"date\":\"$(date -u +%FT%TZ)\",\"sequence\":$(jq .sequence manifest.json),\"sha256\":\"$(sha256sum manifest.json | cut -d' ' -f1)\"}" >> changelog.ndjson
          # TODO(infra): GitHub release attaching manifest + compliance report + SBOMs:
          #   gh release create nightly-$(date -u +%Y-%m-%d) manifest.json manifest.sig compliance-report.json sbom-*.json
          echo "SCAFFOLD publish complete (nothing was actually uploaded)."

      - name: Upload signed manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-manifest
          path: |
            manifest.json
            manifest.sig
          if-no-files-found: warn

  # ── (g) notify ────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: sign-and-publish
    if: always()
    steps:
      - name: Download compliance report
        uses: actions/download-artifact@v4
        with:
          name: compliance-report
        continue-on-error: true

      - name: Discord notification (TODO — no webhook yet)
        env:
          # TODO(infra): DISCORD_WEBHOOK secret does not exist yet.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          echo "::warning::Discord notify is a SCAFFOLD. TODO(infra): DISCORD_WEBHOOK secret."
          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            # Per-job results embed. sign-and-publish.result reflects whether the
            # publish stage (and its a-e prerequisites) succeeded.
            PUBLISH_RESULT='${{ needs.sign-and-publish.result }}'
            PAYLOAD=$(jq -n --arg r "$PUBLISH_RESULT" --arg run "${{ github.run_id }}" \
              '{embeds:[{title:"Nightly Enforce", description:("sign-and-publish: " + $r + " — run " + $run)}]}')
            curl -fsSL -H 'Content-Type: application/json' -X POST "$DISCORD_WEBHOOK" -d "$PAYLOAD" \
              || echo "::warning::Discord post failed."
          else
            echo "DISCORD_WEBHOOK unset — skipping (expected until the secret exists)."
          fi

      - name: Write compliance table to step summary
        # This part works today — no infra required.
        run: |
          set -euo pipefail
          {
            echo "## Nightly Enforce — compliance summary"
            echo ""
            echo "Run: ${{ github.run_id }} · trigger: ${{ github.event_name }}"
            echo ""
            if [ -f compliance-report.json ]; then
              echo "| Entry | Verdict |"
              echo "|---|---|"
              jq -r '.entries[]? | "| \(.entry // "?") | \(.verdict // "?") |"' compliance-report.json 2>/dev/null \
                || echo "| (could not parse compliance-report.json) | ? |"
              echo ""
              echo "Overall verdict: \`$(jq -r '.verdict // "unknown"' compliance-report.json 2>/dev/null)\`"
            else
              echo "_No compliance-report.json artifact (registry-audit may not have run)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
