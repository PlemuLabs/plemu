[workspace]
members = ["crates/plemu-schemas", "crates/plemu-manifest", "crates/plemu-dat", "crates/plemu-screen", "crates/plemu-core-audit"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/plemu-labs/plemu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
tempfile = "3"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
crc32fast = "1"
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
bs58 = "0.5"
strsim = "0.11"
zip = "2"
assert_cmd = "2"
plemu-schemas = { path = "crates/plemu-schemas" }
plemu-dat = { path = "crates/plemu-dat" }
