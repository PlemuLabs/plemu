[package]
name = "plemu-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Content screening tool: digest verification, attestation checks, archive safety."

[[bin]]
name = "plemu-screen"
path = "src/main.rs"

[lib]
name = "plemu_screen"
path = "src/lib.rs"

[dependencies]
